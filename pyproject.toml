[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlio-cloud"
version = "0.1.0"
description = "Cloud database performance test suite: I/O benchmarking, integrity stress testing, and analytical queries"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "sqlshep" }]
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pymysql>=1.1",
    "cryptography>=42.0",
    "pymssql>=2.3",
    "click>=8.1",
    "questionary>=2.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pyinstaller>=6.0",
]

[project.scripts]
sqlio-cloud = "sqlio_cloud.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sqlio_cloud = ["web/static/*"]
